name: Build FaceIDOrientationProbe (RootHide)

on:
  workflow_dispatch:
  push:
    branches:
      - faceid-orientation-probe
    paths:
      - "FaceIDOrientationProbe/**"
      - ".github/workflows/faceid-orientation-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install RootHide Theos
        run: git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -eu
          mkdir -p "$HOME/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd FaceIDOrientationProbe
          make clean
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qi "incompatible arm64e ABI" "$RUNNER_TEMP/build.log"; then
            echo "Refusing package with incompatible arm64e ABI warning"
            exit 1
          fi
          python3 tools/check_package.py packages/*.deb
          dylib="$(find .theos -name FaceIDOrientationProbe.dylib -type f | head -n 1)"
          test -n "$dylib"
          xcrun lipo -info "$dylib"
          xcrun otool -L "$dylib"
          mkdir -p build-info
          cp "$RUNNER_TEMP/build.log" build-info/
          shasum -a 256 packages/*.deb > build-info/SHA256SUMS.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FaceIDOrientationProbe-0.1.0-RootHide
          if-no-files-found: error
          path: |
            FaceIDOrientationProbe/packages/*.deb
            FaceIDOrientationProbe/build-info/*
            FaceIDOrientationProbe/README.md
