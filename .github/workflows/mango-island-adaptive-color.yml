name: Build MangoIslandAdaptiveColor 0.1.3.1 RootHide
on:
  workflow_dispatch:
  push:
    branches: [mango-island-adaptive-color-012-slider-preview]
    paths: ['MangoIslandAdaptiveColor/**', '.github/workflows/mango-island-adaptive-color.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MangoIslandAdaptiveColor
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0.1.3.1 stability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_stability_fix.py
      - name: Verify stability patch and Island-only guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MangoIslandAdaptiveColor_FILES = TweakSafe.m' Makefile
          grep -q 'MangoIslandAdaptiveColorPrefs_FILES = PrefsSafe.m' MangoIslandAdaptiveColorPrefs/Makefile
          grep -q 'return LightMarkerForPacked(packed);' TweakSafe.m
          grep -q 'float3 referenceBackground' TweakSafe.m
          grep -q 'float3 miaReference = src.sample(s, captureUV).rgb' TweakSafe.m
          grep -q 'mangoIslandAdaptiveColor(flat.rgb, flat.rgb, u.tintColor)' TweakSafe.m
          grep -q '0.1.3.1 stable-reference' TweakSafe.m
          grep -q 'MarkerAlphaForPacked' TweakSafe.m
          grep -q 'miaMarkerAlpha' TweakSafe.m
          grep -q '恢复默认参数' MangoIslandAdaptiveColorPrefs/PrefsSafe.m
      - name: Install tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make
      - name: Install RootHide Theos
        run: git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
      - name: Install SDK
        run: |
          set -eu
          curl --fail --location --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz --output "$RUNNER_TEMP/sdk.tar.xz"
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $RUNNER_TEMP/sdk.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/theos/sdks"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/build.log"
          dylib="$(find .theos -name MangoIslandAdaptiveColor.dylib -type f | head -n 1)"
          prefs="$(find .theos -name MangoIslandAdaptiveColorPrefs -type f | head -n 1)"
          test -n "$dylib" && test -n "$prefs"
          xcrun lipo -info "$dylib"
          xcrun lipo -info "$prefs"
          xcrun otool -L "$dylib"
          dpkg-deb -I packages/*.deb | tee "$RUNNER_TEMP/control.txt"
          grep -q 'Version: 0.1.3.1' "$RUNNER_TEMP/control.txt"
          dpkg-deb -c packages/*.deb | tee "$RUNNER_TEMP/package-files.txt"
          grep -q 'MangoIslandAdaptiveColorPrefs.bundle' "$RUNNER_TEMP/package-files.txt"
          grep -q 'PreferenceLoader/Preferences/MangoIslandAdaptiveColorPrefs.plist' "$RUNNER_TEMP/package-files.txt"
          echo '[check] stable renderer signature'
          strings "$dylib" | grep -F -q '0.1.3.1 stable-reference Island glass compiled'
          echo '[check] island-only marker'
          strings "$dylib" | grep -F -q '[ISLAND-ONLY]'
          echo '[check] configurable key'
          strings "$dylib" | grep -q 'MangoIslandAdaptiveColor.BrightOpacity'
          echo '[check] reset selector'
          strings "$prefs" | grep -q 'resetDefaults:'
          if strings "$prefs" | grep -q 'MIAAdaptivePreviewCell'; then
            echo 'Preview cell unexpectedly present' >&2
            exit 1
          fi
          if strings "$prefs" | grep -q 'MIAAdaptivePreviewView'; then
            echo 'Preview view unexpectedly present' >&2
            exit 1
          fi
          shasum -a 256 packages/*.deb > packages/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MangoIslandAdaptiveColor-0.1.3.1-RootHide
          if-no-files-found: error
          path: |
            MangoIslandAdaptiveColor/packages/*.deb
            MangoIslandAdaptiveColor/packages/SHA256SUMS.txt
            MangoIslandAdaptiveColor/README.md