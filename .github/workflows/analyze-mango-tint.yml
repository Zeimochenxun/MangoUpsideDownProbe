name: Analyze Mango tint semantics

on:
  push:
    branches: [mango-idle-island-probe]
    paths: ['.github/workflows/analyze-mango-tint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout Mango binaries
        uses: actions/checkout@v4
        with:
          repository: Zeimochenxun/Mango
          path: mango-source
      - name: Analyze tint-related strings and Objective-C metadata
        shell: bash
        run: |
          set -euo pipefail
          : > report.txt
          for f in mango-source/mango/*.dylib; do
            echo "===== $f =====" >> report.txt
            echo "-- exact string offsets --" >> report.txt
            strings -a -t x "$f" | grep -Ei 'Island\.|LightTint|DarkTint|TintStrength|TintColor|tint|alpha|opacity|reapplyFilterForParameterReload|ParametersReloaded|go\.mangoos\.island|MGLiveBackdropView' >> report.txt || true
            echo "-- Objective-C metadata / symbols --" >> report.txt
            otool -ov "$f" 2>/dev/null | grep -Ei -B2 -A4 'Tint|Color|Alpha|Opacity|reapplyFilterForParameterReload|MGLiveBackdropView' >> report.txt || true
            nm -m "$f" 2>/dev/null | grep -Ei 'Tint|Color|Alpha|Opacity|Filter|Backdrop|reapply' >> report.txt || true
            echo >> report.txt
          done
          cat report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mango-tint-analysis
          path: report.txt
          if-no-files-found: error
