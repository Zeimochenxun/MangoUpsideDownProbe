name: Build MangoSplitGeometryProbe (RootHide)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install RootHide Theos
        run: git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install verified iOS 16.5 SDK
        run: |
          set -eu
          mkdir -p "$HOME/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Build and inspect
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          xcrun clang --version | tee compiler.txt
          git -C "$THEOS" rev-parse HEAD | tee theos-commit.txt
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log
          if grep -qi 'incompatible arm64e ABI' build.log; then exit 1; fi
          python3 tools/check_package.py packages/*.deb
          dylib="$(find .theos -name MangoSplitGeometryProbe.dylib -type f | head -n 1)"
          test -n "$dylib"
          xcrun lipo -info "$dylib" | tee architecture.txt
          xcrun otool -L "$dylib" | tee dependencies.txt
          mkdir -p build-info
          mv compiler.txt theos-commit.txt build.log architecture.txt dependencies.txt build-info/
          shasum -a 256 packages/*.deb Probe.m STATIC_FINDINGS_ZH.md > build-info/SHA256SUMS.txt

      - name: Upload package, source and evidence
        uses: actions/upload-artifact@v4
        with:
          name: MangoSplitGeometryProbe-0.3.2-RootHide
          if-no-files-found: error
          path: |
            packages/*.deb
            build-info/*
            Makefile
            control
            MangoSplitGeometryProbe.plist
            Probe.m
            README.md
            STATIC_FINDINGS_ZH.md
            TEST_MATRIX.md
