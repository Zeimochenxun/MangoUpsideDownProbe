name: Build MangoUpsideDownWorld (RootHide)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify geometry arithmetic
        run: |
          set -eu
          xcrun clang -std=c11 -Wall -Wextra -Werror tests/world_math_test.c -o "$RUNNER_TEMP/geometry-test"
          "$RUNNER_TEMP/geometry-test"

      - name: Verify island arithmetic
        run: |
          set -eu
          xcrun clang -std=c11 -Wall -Wextra -Werror island/tests/island_test.c -o "$RUNNER_TEMP/island-test"
          "$RUNNER_TEMP/island-test"

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install RootHide Theos
        run: |
          set -eu
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          set -eu
          mkdir -p "$HOME/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          python3 - "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" <<'PY'
          import hashlib, sys
          from pathlib import Path
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          expected = '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb'
          if actual != expected:
              raise SystemExit('SDK checksum mismatch')
          PY
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Build and inspect RootHide package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          xcrun clang --version
          git -C "$THEOS" rev-parse HEAD
          shasum -a 256 Tweak.xm WorldMath.h "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          make clean
          make package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/mangoworld-build.log"
          if grep -qi 'incompatible arm64e ABI' "$RUNNER_TEMP/mangoworld-build.log"; then
            echo 'Refusing package with incompatible arm64e ABI warning'
            exit 1
          fi
          python3 tools/check_package.py packages/*.deb
          dylib="$(find .theos -name MangoUpsideDownWorld.dylib -type f | head -n 1)"
          test -n "$dylib"
          xcrun lipo -info "$dylib"
          xcrun otool -L "$dylib"
          xcrun otool -l "$dylib" > "$RUNNER_TEMP/mangoworld-load-commands.txt"
          mkdir -p build-info
          cp "$RUNNER_TEMP/mangoworld-build.log" "$RUNNER_TEMP/mangoworld-load-commands.txt" build-info/
          shasum -a 256 packages/*.deb > build-info/SHA256SUMS.txt

      - name: Upload package and build information
        uses: actions/upload-artifact@v4
        with:
          name: MangoUpsideDownWorld-1.3.0
          if-no-files-found: error
          path: |
            packages/*.deb
            build-info/*
            README.md
            EVIDENCE.md

      - name: Build and inspect camera package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          shasum -a 256 camera/Tweak.xm camera/MangoUpsideDownCamera.plist
          make -C camera clean
          make -C camera package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/mangocamera-build.log"
          if grep -qi 'incompatible arm64e ABI' "$RUNNER_TEMP/mangocamera-build.log"; then
            echo 'Refusing package with incompatible arm64e ABI warning'
            exit 1
          fi
          dylib="$(find camera/.theos -name MangoUpsideDownCamera.dylib -type f | head -n 1)"
          test -n "$dylib"
          xcrun lipo -info "$dylib"
          xcrun otool -L "$dylib"
          xcrun otool -l "$dylib" > "$RUNNER_TEMP/mangocamera-load-commands.txt"
          mkdir -p camera-build-info
          cp "$RUNNER_TEMP/mangocamera-build.log" "$RUNNER_TEMP/mangocamera-load-commands.txt" camera-build-info/
          shasum -a 256 camera/packages/*.deb > camera-build-info/SHA256SUMS.txt

      - name: Upload camera package and build information
        uses: actions/upload-artifact@v4
        with:
          name: MangoUpsideDownCamera-2.0.0
          if-no-files-found: error
          path: |
            camera/packages/*.deb
            camera-build-info/*

      - name: Build and inspect Dynamic Island package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          # The log goes straight into the artifact folder so a failed build still uploads it.
          mkdir -p island-build-info
          shasum -a 256 island/*.m island/*.h island/prefs/*.m island/control
          make -C island clean
          make -C island package FINALPACKAGE=1 2>&1 | tee island-build-info/island-build.log
          if grep -qi 'incompatible arm64e ABI' island-build-info/island-build.log; then
            echo 'Refusing package with incompatible arm64e ABI warning'
            exit 1
          fi
          echo "compiler warnings: $(grep -c 'warning:' island-build-info/island-build.log || true)"
          python3 tools/check_island_package.py island/packages/*.deb
          dylib="$(find island/.theos -name DynamicIsland.dylib -type f | head -n 1)"
          test -n "$dylib"
          xcrun lipo -info "$dylib"
          xcrun otool -L "$dylib"
          xcrun otool -l "$dylib" > island-build-info/island-load-commands.txt
          shasum -a 256 island/packages/*.deb > island-build-info/SHA256SUMS.txt

      - name: Upload Dynamic Island package and build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-0.1.0
          if-no-files-found: warn
          path: |
            island/packages/*.deb
            island-build-info/*
            island/README.md
