name: Build SystemFlipProbe (RootHide, read-only)

on:
  workflow_dispatch:
  push:
    branches: [system-flip-probe]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install signing and make tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make
      - name: Install RootHide Theos
        run: |
          set -eu
          git clone https://github.com/roothide/theos.git "$HOME/theos"
          git -C "$HOME/theos" checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$HOME/theos" submodule update --init --recursive
      - name: Install pinned iOS 16.5 SDK
        run: |
          set -eu
          mkdir -p "$HOME/theos/sdks"
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          python3 - "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" <<'PY'
          import hashlib, sys
          from pathlib import Path
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          expected = '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb'
          if actual != expected:
              raise SystemExit('SDK checksum mismatch')
          PY
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build and validate exact package
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          mkdir -p build-info
          xcrun clang --version > build-info/compiler.txt
          git rev-parse HEAD > build-info/source-commit.txt
          git -C "$THEOS" rev-parse HEAD > build-info/theos-commit.txt
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build-info/build.log
          if grep -qi 'incompatible arm64e ABI' build-info/build.log; then
            exit 1
          fi
          python3 tools/check_package.py packages/*.deb | tee build-info/package-check.txt
          shasum -a 256 packages/*.deb > build-info/SHA256SUMS.txt
          for name in SystemFlipProbeSB SystemFlipProbeBB; do
            dylib="$(find .theos -name "$name.dylib" -type f | head -n 1)"
            test -n "$dylib"
            xcrun lipo -info "$dylib" > "build-info/$name-architecture.txt"
            xcrun otool -L "$dylib" > "build-info/$name-dependencies.txt"
          done
      - name: Upload package, source, evidence and instructions
        uses: actions/upload-artifact@v4
        with:
          name: SystemFlipProbe-0.1.0-RootHide
          if-no-files-found: error
          path: |
            packages/*.deb
            build-info/*
            README.md
            Probe.m
            Makefile
            control
            SystemFlipProbeSB.plist
            SystemFlipProbeBB.plist
            capture/Makefile
            capture/main.c
            tools/*.py
            docs/**
